<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Employee Management System</h1>

        <div class="form-container">

            <h2 id="form-title">Add Employee</h2>

            <form id="employeeForm">

                <input type="hidden" id="employeeId">

                <input
                    type="text"
                    id="name"
                    placeholder="Employee Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="text"
                    id="department"
                    placeholder="Department"
                    required
                >

                <input
                    type="number"
                    id="salary"
                    placeholder="Salary"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit" id="submitBtn">
                    Add Employee
                </button>

                <button
                    type="button"
                    id="cancelBtn"
                    class="cancel"
                    hidden
                >
                    Cancel Edit
                </button>

            </form>

            <p id="message"></p>

        </div>


        <div class="table-container">

            <h2>Employee Records</h2>

            <button
                onclick="loadEmployees()"
                class="refresh"
            >
                Refresh Records
            </button>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Salary</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="employeeTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
